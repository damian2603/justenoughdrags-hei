name: Build

# Triggers:
#   - any push to any branch  -> builds + uploads the jar as a workflow artifact
#   - any PR                  -> same
#   - any tag starting with v -> builds AND publishes a GitHub Release with the jar attached
#   - manual dispatch         -> button on Actions tab for ad-hoc builds
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a new commit lands on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # RFG 2.0.2 ships bytecode at class file version 69 (Java 25), so the
      # JVM that runs Gradle needs to be at least JDK 25. The mod itself still
      # compiles to Java 8 bytecode for Minecraft 1.12.2 via the toolchain
      # configured in build.gradle.
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Cache Gradle caches AND the RFG userdev cache (which contains the
      # decompiled MC sources). The first run is ~10 min; subsequent runs are
      # 1-3 min if the cache is warm.
      - name: Cache Gradle / RFG caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rfg-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rfg-

      # Derive the mod version:
      #   - Tag refs/tags/vX.Y.Z      -> X.Y.Z
      #   - Anything else             -> 1.6.0-hei-dev.<short-sha>
      - name: Compute mod version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.6.0-hei-dev.${GITHUB_SHA::7}"
          fi
          echo "mod_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.mod_version }} --stacktrace --no-daemon

      - name: List artifacts
        run: ls -la build/libs/ || true

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: justenoughdrags-hei-${{ steps.version.outputs.mod_version }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # On v* tag, also create a GitHub Release with the jar attached.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
