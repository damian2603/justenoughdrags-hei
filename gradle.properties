# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
use_modern_java_syntax = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = 1.6.0-hei
root_package = com.warmthdawn
mod_id = justenoughdrags
mod_name = Just Enough Drags (HEI fork)

# Mod Metadata
mod_description = Fork of WarmthDawn's Just Enough Drags with HEI bookmark-panel ghost-drag support. AE2-UEL and EnderIO are patched via runtime Mixins; other supported mods are patched at source level.
mod_url =
mod_update_json =
mod_authors = WarmthDawn (original), you (HEI fork)
mod_credits = AE2 Mixin logic ported from Exaxxion's unmerged fd39333 patch.
mod_logo_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# No publishing - this is a personal/community fork, not headed to CurseForge/Modrinth.
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

release_type = release
publish_with_changelog = ${{ it.file('CHANGELOG.md').exists() }}

publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false

publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

change_minecraft_sources = false

# Tags - generates com.warmthdawn.justenoughdrags.Tags at build time with our
# version/modid/modname constants, so we don't need @VERSION@ token replacement.
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers - not used.
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins - enabled for AE2-UEL + EnderIO HEI patches.
use_mixins = true
mixin_booter_version = 10.2
# Don't autogenerate - we already have mixins.justenoughdrags.json checked in.
generate_mixins_json = false
mixin_configs = ${mod_id} ${mod_id}-ae2 ${mod_id}-enderio
mixin_package = ${root_package}.${mod_id}.mixin
mixin_refmap = mixins.${mod_id}.refmap.json

# Coremods - not needed; we use Mixin via MixinBooter instead.
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover - not used.
use_asset_mover = false
asset_mover_version = 2.5
